title: Read of on-disk credential material
id: 1a2b3c4d-0003-4a5b-8c6d-000000000003
status: experimental
description: >
  A command referenced a file that stores long-lived credentials - cloud keys,
  SSH private keys, kubeconfig, container registry auth, or a .netrc. Autonomous
  agents tasked with "find a way in" reach for these paths early and directly,
  because a model knows exactly where they live. The read itself is the event;
  the behavioral detections tie it to what happens next.
references:
  - https://attack.mitre.org/techniques/T1552/001/
logsource:
  product: linux
  category: process_creation
detection:
  selection:
    event_type: process_creation
    command_line|contains:
      - .aws/credentials
      - .ssh/id_rsa
      - .ssh/id_ed25519
      - .ssh/id_dsa
      - .kube/config
      - .docker/config.json
      - .netrc
      - .git-credentials
  condition: selection
falsepositives:
  - Backup or configuration-management tooling that legitimately reads these
    paths. Scope those specific images or accounts out.
level: high
tags:
  - attack.credential-access
  - attack.t1552.001
