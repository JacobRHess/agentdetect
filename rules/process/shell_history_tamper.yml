title: Shell history disabled or cleared
id: 1a2b3c4d-0005-4a5b-8c6d-000000000005
status: experimental
description: >
  A command disabled or wiped shell history - redirecting HISTFILE to /dev/null,
  zeroing HISTSIZE, turning off history logging, or truncating .bash_history.
  This is defense evasion, and an agent prompted to "stay quiet" or "clean up
  after yourself" emits it verbatim near the start of a session.
references:
  - https://attack.mitre.org/techniques/T1070/003/
  - https://attack.mitre.org/techniques/T1562/003/
logsource:
  product: linux
  category: process_creation
detection:
  selection:
    event_type: process_creation
    command_line|contains:
      - HISTFILE=/dev/null
      - unset HISTFILE
      - HISTSIZE=0
      - HISTFILESIZE=0
      - set +o history
      - history -c
  selection_truncate:
    event_type: process_creation
    command_line|contains:
      - '> ~/.bash_history'
      - '> /root/.bash_history'
      - 'rm ~/.bash_history'
      - 'rm /root/.bash_history'
  condition: selection or selection_truncate
falsepositives:
  - Rare. Some hardening scripts set HISTSIZE deliberately; scope the specific
    provisioning image out if it trips this.
level: high
tags:
  - attack.defense-evasion
  - attack.t1070.003
  - attack.t1562.003
