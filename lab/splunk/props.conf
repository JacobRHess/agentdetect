# Fixtures arrive as JSON over HEC. Without KV_MODE=json the command_line,
# dest_host, exit_code and other fields the rules reference are not searchable,
# and every detection comes back empty - a silent false pass on the benign half
# and a false fail on the alert half. The harness sets each event's _time from
# its own timestamp, so the behavioral searches measure the real inter-arrival
# gaps in the trace rather than the instant it was ingested.
[agent:telemetry]
KV_MODE = json
SHOULD_LINEMERGE = false
