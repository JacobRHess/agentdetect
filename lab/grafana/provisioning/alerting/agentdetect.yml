        refId: A
        expr: count by (session) (count_over_time({job="agentdetect"} | json | event_type=~`(?i)^network_connection$`
          and (dest_host=~`(?i)^api\.anthropic\.com$` or dest_host=~`(?i)^api\.openai\.com$` or dest_host=~`(?i)^api\.mistral\.ai$`
          or dest_host=~`(?i)^api\.cohere\.ai$` or dest_host=~`(?i)^api\.x\.ai$` or dest_host=~`(?i)^api\.deepseek\.com$`
