  - uid: ad-recon-breadth-burst
    title: Broad host reconnaissance compressed into one session
    condition: C
    data:
    - refId: A
      queryType: instant
      relativeTimeRange:
        from: 900
        to: 0
      datasourceUid: agentdetect-loki
      model:
        refId: A
        expr: "count by (session) (\ncount by (session) (\n  sum by (session, recon) (\n    count_over_time({job=\"\
          agentdetect\"} | json | event_type=\"process_creation\"\n      | label_format recon=`{{ if count\
          \ \"(?i)(^|[[:space:]])(whoami|id)([[:space:]]|$)\" .command_line }}identity{{ else if count\
          \ \"(?i)(uname|hostname|lsb_release|/etc/os-release|/etc/issue)\" .command_line }}sysinfo{{\
          \ else if count \"(?i)(ip[[:space:]]+a|ip[[:space:]]+addr|ifconfig|netstat|(^|[[:space:]])ss[[:space:]]+-|(^|[[:space:]])route([[:space:]]|$))\"\
          \ .command_line }}netconfig{{ else if count \"(?i)((^|[[:space:]])ps[[:space:]]|pgrep|(^|[[:space:]])top([[:space:]]|$)|htop)\"\
          \ .command_line }}procs{{ else if count \"(?i)((^|[[:space:]])env([[:space:]]|$)|printenv)\"\
          \ .command_line }}env{{ else if count \"(?i)sudo[[:space:]]+-l\" .command_line }}privs{{ else\
          \ if count \"(?i)(crontab[[:space:]]+-l|systemctl[[:space:]]+list|service[[:space:]]+--status-all)\"\
          \ .command_line }}services{{ else if count \"(?i)(-perm[[:space:]]+[-/]?[0-9]*4000)\" .command_line\
          \ }}suid{{ else if count \"(?i)(/etc/passwd|getent[[:space:]]+passwd|/etc/shadow)\" .command_line\
          \ }}accounts{{ else if count \"(?i)((^|[[:space:]])mount([[:space:]]|$)|lsblk|(^|[[:space:]])df[[:space:]]+-)\"\
          \ .command_line }}storage{{ else if count \"(?i)(dpkg[[:space:]]+-l|rpm[[:space:]]+-qa|apt[[:space:]]+list|pip[[:space:]]+list)\"\
          \ .command_line }}software{{ end }}`\n      | recon != \"\" [2m])\n  )\n) >= 6\n)"
        queryType: instant
        editorMode: code
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: reduce
        expression: A
        reducer: last
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: B
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
    noDataState: OK
    execErrState: Error
    for: 0s
    labels:
