# Local lab: a single-node Splunk and a single-binary Loki, the same engines the
# CI validate job boots. Bring them up, then `uv run pytest -m replay` replays
# every fixture through both.
#
#   docker compose -f lab/docker-compose.yml up -d
#
# Splunk listens on 8000 (web), 8088 (HEC), 8089 (REST); Loki on 3100.
# Throwaway dev credentials; nothing here is a secret.
services:
  splunk:
    image: splunk/splunk:9.4.2
    container_name: ad-splunk
    ports:
      - "8000:8000"
      - "8088:8088"
      - "8089:8089"
    environment:
      SPLUNK_START_ARGS: --accept-license
      SPLUNK_PASSWORD: agentdetect_dev_2026
    volumes:
      # Writable, not :ro - the image's first-boot provisioning chowns this dir.
      - ./splunk:/opt/splunk/etc/apps/agentdetect/local
    healthcheck:
      test: ["CMD", "curl", "-fk", "https://localhost:8089/services/server/info"]
      interval: 10s
      timeout: 5s
      retries: 30

  loki:
    image: grafana/loki:3.5.0
    container_name: ad-loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
