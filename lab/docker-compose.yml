# Local lab: a single-node Splunk and a single-binary Loki, the same engines the
# CI validate job boots. Bring them up, then `uv run pytest -m replay` replays
# every fixture through both.
#
#   docker compose -f lab/docker-compose.yml up -d
#
# Splunk listens on 8000 (web), 8088 (HEC), 8089 (REST); Loki on 3100; Grafana
# on 3001 with the Loki datasource, the alert rules and a dashboard provisioned.
# Run `uv run agentdetect seed` to give Grafana sessions to look at.
# Throwaway dev credentials; nothing here is a secret.
services:
  splunk:
    image: splunk/splunk:9.4.2
    container_name: ad-splunk
    ports:
      - "8000:8000"
      - "8088:8088"
      - "8089:8089"
    environment:
      SPLUNK_START_ARGS: --accept-license
      SPLUNK_PASSWORD: agentdetect_dev_2026
    volumes:
      # Writable, not :ro - the image's first-boot provisioning chowns this dir.
      - ./splunk:/opt/splunk/etc/apps/agentdetect/local
    healthcheck:
      test: ["CMD", "curl", "-fk", "https://localhost:8089/services/server/info"]
      interval: 10s
      timeout: 5s
      retries: 30

  loki:
    image: grafana/loki:3.5.0
    container_name: ad-loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml

  grafana:
    image: grafana/grafana:12.1.1
    container_name: ad-grafana
    ports:
      - "3001:3000"
    environment:
      # Lab only: no login, so the provisioned content opens straight away.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - loki
